services:
  web:
    build:
      context: .
    image: waves:local
    command: sh -c "node apps/web/docker-migrate.mjs && node apps/web/.output/server/index.mjs"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/data/waves.db
    ports:
      - '3000:3000'
    volumes:
      - waves-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  bot:
    image: waves:local
    command: node apps/bot/dist/index.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOT_API_BASE_URL: http://web:3000/api
      INTERNAL_WEB_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  waves-data:
